name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Catches broken content frontmatter and type errors before merge —
      # the same command the deploy workflow runs.
      - run: npm run build
